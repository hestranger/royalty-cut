<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROYALTY CUT — Admin</title><style>body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif;padding:30px}.wrap{max-width:1100px;margin:auto}h1{font-family:Georgia,serif}.gold{color:#e5c56d}input,button,select{padding:11px;border:1px solid #3a3428;background:#111;color:#eee;border-radius:4px}button{cursor:pointer;background:#d8b15a;color:#111;font-weight:700}.panel{background:#111;border:1px solid #2b2925;padding:22px;margin:20px 0;border-radius:6px}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #292722;white-space:nowrap}small{color:#999}.pill{padding:4px 8px;border:1px solid #66552e;border-radius:20px;font-size:12px}</style></head><body><div class="wrap"><h1>ROYALTY <span class="gold">CUT</span></h1><div id="login" class="panel"><h2>Admin Login</h2><input id="pw" type="password" placeholder="Admin password"><button onclick="login()">Login</button><p id="err"></p></div><div id="app" hidden><div class="panel"><h2>Appointments</h2><button onclick="load()">Refresh</button> <button onclick="logout()">Logout</button></div><div class="panel table"><table><thead><tr><th>When</th><th>Client</th><th>Service</th><th>Location</th><th>Payment</th><th>Appointment</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>let token='';async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});let d=await r.json();if(!r.ok){err.textContent=d.error;return}token=d.token;login.hidden=true;app.hidden=false;load()}async function load(){let r=await fetch('/api/admin/bookings',{headers:{'X-Admin-Token':token}});if(!r.ok)return;let d=await r.json();rows.innerHTML=d.bookings.map(b=>`<tr><td>${b.date}<br>${b.time}</td><td><b>${esc(b.name)}</b><br><small>${esc(b.phone)}</small></td><td>${esc(b.service)}<br><small>${esc(b.price)}</small></td><td>${esc(b.location)}</td><td><span class="pill">${b.payment_status}</span></td><td><span class="pill">${b.appointment_status}</span></td><td><button onclick="update(${b.id},'payment_status','paid')">Paid</button> <button onclick="update(${b.id},'appointment_status','confirmed')">Confirm</button> <button onclick="update(${b.id},'appointment_status','cancelled')">Cancel</button></td></tr>`).join('')}async function update(id,k,v){await fetch('/api/admin/bookings/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','X-Admin-Token':token},body:JSON.stringify({[k]:v})});load()}async function logout(){await fetch('/api/admin/logout',{method:'POST',headers:{'X-Admin-Token':token}});location.reload()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
